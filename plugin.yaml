name: grounded-web
version: 0.1.0
manifest_version: 2
api_version: 1
description: "Local page and PDF extraction for web_extract, the pages an answer really used, and a check of the answer's values against them"
author: ElSerda
license: MIT
requires_hermes: ">=0.22.6"
tags: [web, research, citations, verification, grounding]
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - transform_llm_output
provides_web_providers:
  - grounded-web
python_dependencies:
  - "trafilatura>=2.0,<3"
  - "pypdf>=6.0,<7"
config_schema:
  language:
    type: str
    choices: [auto, answer, en, fr]
    default: auto
    label: Footer language
    description: "auto follows Hermes's display.language (English for languages other than en/fr); answer follows the language of the reply"
  show_sources:
    type: str
    choices: [auto, always, never]
    default: auto
    label: List opened pages
    description: "auto steps aside when another enabled plugin also rewrites replies (Hermes keeps only one rewrite); always adds the footer; never turns it off"
  verify:
    type: bool
    default: false
    label: Show the value check under the answer
    description: "Adds lines such as '2 of the 22 numbers in this answer are not in the opened pages'"
  remind:
    type: bool
    default: true
    label: Remind the model to open pages
    description: "Adds one sentence (about 50 tokens) to each user message: search snippets are not sources"
